name: Deploy web (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared package and dashboard
        run: |
          npm run build -w @scraping/shared
          npm run build -w @scraping/web
        env:
          VITE_API_URL: https://webscrapingapi-gbaec9bzawa9bfbk.westus2-01.azurewebsites.net
          VITE_DEMO_EMAIL: admin@example.com
          VITE_DEMO_PASSWORD: change-me-password

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_SKY_0D749CF10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
