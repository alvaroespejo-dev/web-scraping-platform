services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraping
      POSTGRES_PASSWORD: scraping
      POSTGRES_DB: scraping
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
