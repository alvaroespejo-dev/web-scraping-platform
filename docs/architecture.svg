<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Scraping Management Platform</text>
  <text x="800" y="84" text-anchor="middle" font-size="15" fill="#475569">Architecture overview: dashboard, API, queue, worker and scraping engines</text>

  <!-- Layer groups -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="40" y="130" width="240" height="180" rx="14"/>
    <rect x="320" y="130" width="320" height="380" rx="14"/>
    <rect x="760" y="130" width="300" height="390" rx="14"/>
    <rect x="760" y="550" width="300" height="180" rx="14"/>
    <rect x="1080" y="500" width="300" height="270" rx="14"/>
    <rect x="1400" y="490" width="180" height="290" rx="14"/>
  </g>
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">
    <text x="60" y="152">CLIENT</text>
    <text x="340" y="152">APPLICATION</text>
    <text x="780" y="152">DATA &amp; QUEUE</text>
    <text x="780" y="572">PROCESSING</text>
    <text x="1100" y="522">SCRAPING</text>
    <text x="1420" y="512">INTERNET</text>
  </g>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="225" x2="340" y2="225"/>
    <line x1="480" y1="280" x2="480" y2="380"/>
    <line x1="620" y1="435" x2="780" y2="435"/>
    <line x1="620" y1="400" x2="780" y2="290"/>
    <line x1="910" y1="490" x2="910" y2="580"/>
    <line x1="1040" y1="612" x2="1100" y2="585"/>
    <line x1="1040" y1="668" x2="1100" y2="705"/>
    <line x1="1350" y1="585" x2="1400" y2="585"/>
    <line x1="1350" y1="705" x2="1400" y2="705"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="300" y="214" text-anchor="middle">HTTPS</text>
    <text x="492" y="336">REST · JWT</text>
    <text x="700" y="424" text-anchor="middle">enqueue jobs · cron</text>
    <text x="692" y="342" text-anchor="middle" transform="rotate(-30 692 342)">Prisma</text>
    <text x="928" y="540">jobs</text>
  </g>

  <!-- Boxes -->
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#shadow)">
    <rect x="60" y="170" width="200" height="110" rx="10"/>
    <rect x="340" y="170" width="280" height="110" rx="10"/>
    <rect x="780" y="170" width="260" height="110" rx="10"/>
    <rect x="340" y="380" width="280" height="120" rx="10"/>
    <rect x="780" y="380" width="260" height="110" rx="10"/>
    <rect x="780" y="580" width="260" height="120" rx="10"/>
    <rect x="1100" y="540" width="250" height="90" rx="10"/>
    <rect x="1100" y="660" width="250" height="90" rx="10"/>
    <rect x="1400" y="520" width="180" height="240" rx="10"/>
  </g>

  <!-- Box text -->
  <g text-anchor="middle">
    <text x="160" y="206" font-size="17" font-weight="700" fill="#0f172a">Browser</text>
    <text x="160" y="230" font-size="13" fill="#475569">Recruiters, reviewers,</text>
    <text x="160" y="248" font-size="13" fill="#475569">administrators</text>

    <text x="480" y="204" font-size="17" font-weight="700" fill="#0f172a">Dashboard</text>
    <text x="480" y="228" font-size="13" fill="#475569">React 19 · Vite · TanStack Query</text>
    <text x="480" y="248" font-size="13" fill="#475569">Recharts · Tailwind CSS</text>

    <text x="910" y="204" font-size="17" font-weight="700" fill="#0f172a">Database</text>
    <text x="910" y="228" font-size="13" fill="#475569">Prisma 6</text>
    <text x="910" y="248" font-size="13" fill="#475569">SQLite (default) or PostgreSQL</text>

    <text x="480" y="416" font-size="17" font-weight="700" fill="#0f172a">API</text>
    <text x="480" y="440" font-size="13" fill="#475569">NestJS 11 · Passport JWT</text>
    <text x="480" y="460" font-size="13" fill="#475569">Zod validation · Swagger · throttling</text>

    <text x="910" y="416" font-size="17" font-weight="700" fill="#0f172a">Redis</text>
    <text x="910" y="440" font-size="13" fill="#475569">BullMQ queue</text>
    <text x="910" y="460" font-size="13" fill="#475569">cron job schedulers</text>

    <text x="910" y="616" font-size="17" font-weight="700" fill="#0f172a">Worker</text>
    <text x="910" y="640" font-size="13" fill="#475569">NestJS application context</text>
    <text x="910" y="660" font-size="13" fill="#475569">consumes jobs · writes results</text>

    <text x="1225" y="578" font-size="17" font-weight="700" fill="#0f172a">Static engine</text>
    <text x="1225" y="604" font-size="13" fill="#475569">Axios + Cheerio</text>

    <text x="1225" y="698" font-size="17" font-weight="700" fill="#0f172a">Dynamic engine</text>
    <text x="1225" y="724" font-size="13" fill="#475569">Playwright · Chromium</text>

    <text x="1490" y="580" font-size="17" font-weight="700" fill="#0f172a">Target</text>
    <text x="1490" y="604" font-size="17" font-weight="700" fill="#0f172a">websites</text>
    <text x="1490" y="636" font-size="12" fill="#475569">HTML pages</text>
    <text x="1490" y="654" font-size="12" fill="#475569">JS-rendered pages</text>
    <text x="1490" y="690" font-size="12" fill="#b91c1c">public hosts only</text>
    <text x="1490" y="708" font-size="12" fill="#b91c1c">(SSRF guard)</text>
  </g>

  <!-- Legend -->
  <text x="800" y="795" text-anchor="middle" font-size="12" fill="#64748b">The API and the worker share one codebase and run as separate processes. Requests flow left to right; results are written back to the database.</text>
</svg>
